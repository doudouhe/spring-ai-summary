server:
  port: 8080
spring:
  application:
    name: spring-ai-workflow-orchestrator
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
        completions-path: /v1/chat/completions

# Orchestrator Workers Configuration
orchestrator-workers:
  task-decomposition-prompt: "你是一个任务拆解专家。请将用户输入的复杂任务描述拆解为若干可以独立执行的子任务，输出格式为 JSON 数组，每个元素为一个子任务字符串。"
  worker-processing-prompt: "你是一个高效的AI助手，请认真完成以下子任务："
  parallel-execution: true
  thread-pool-size: 10