# https://bailian.console.aliyun.com
spring.application.name=spring-ai-chat-rag
server.port=8085
spring.profiles.active=qwen

# qwen model
#spring.ai.openai.chat.api-key=${spring.ai.openai.api-key}
#spring.ai.openai.chat.base-url=https://dashscope.aliyuncs.com/compatible-mode
#spring.ai.openai.chat.completions-path=/v1/chat/completions
#spring.ai.openai.chat.options.model=qwen-plus

# doubao
spring.ai.openai.api-key=${spring.ai.openai.api-key}
spring.ai.openai.chat.base-url=https://ark.cn-beijing.volces.com/api/v3
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=ep-20250117161524-4knd5

# embedding model
spring.ai.openai.embedding.api-key=${spring.ai.openai.embedding.api-key}
spring.ai.openai.embedding.base-url=https://ark.cn-beijing.volces.com/api/v3
spring.ai.openai.embedding.embeddings-path=/embeddings
spring.ai.openai.embedding.options.model=ep-20250506170049-dzjj7

# Milvus Vector Store Configuration
spring.ai.vectorstore.milvus.client.host=localhost
spring.ai.vectorstore.milvus.client.port=19530
#spring.ai.vectorstore.milvus.client.username=root
#spring.ai.vectorstore.milvus.client.password=Milvus
#spring.ai.vectorstore.milvus.databaseName="default"
spring.ai.vectorstore.milvus.collection.name=vector_store

# RAG Optimization Configuration
rag.milvus.async-load=true
rag.milvus.connection-timeout=30000

# Text Splitter Configuration
rag.splitter.default.chunk-size=800
rag.splitter.default.chunk-overlap=200
rag.splitter.default.min-chunk-size-to-embed=50
rag.splitter.default.max-chunk-size-to-embed=1500
rag.splitter.default.keep-separator=true

# Sentence-aware Splitter Configuration
rag.splitter.sentence-aware.enabled=true
rag.splitter.sentence-aware.max-chunk-size=500

# Search Configuration
rag.search.top-k=5
rag.search.similarity-threshold=0.7

# Batch Processing Configuration
rag.batch.size=100

# PDF Processing Configuration
rag.pdf.page-top-margin=0
rag.pdf.top-lines-to-delete=0
rag.pdf.pages-per-document=1

# Markdown Processing Configuration
rag.markdown.include-code-block=false
rag.markdown.include-blockquote=false
rag.markdown.horizontal-rule-create-document=true

# Caching Configuration
spring.cache.type=simple
spring.cache.cache-names=documents

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=rag-async-

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.vectorStore.sliding-window-size=10
resilience4j.circuitbreaker.instances.vectorStore.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vectorStore.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.vectorStore.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.vectorStore.sliding-window-type=COUNT_BASED

resilience4j.retry.instances.vectorStore.max-attempts=3
resilience4j.retry.instances.vectorStore.wait-duration=1s
resilience4j.retry.instances.vectorStore.enable-exponential-backoff=true
resilience4j.retry.instances.vectorStore.exponential-backoff-multiplier=2

resilience4j.timelimiter.instances.vectorStore.timeout-duration=30s

# Logging Configuration
logging.level.com.glmapper.ai.rag=DEBUG
logging.level.io.milvus=WARN
logging.level.io.github.resilience4j=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
